services:
  bot:
    build: .
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?set BOT_TOKEN in the environment or a .env file}
      # Connects to server-infra's shared MongoDB (service alias "mongo" on
      # geoirb_network), not a bot-owned instance. MONGO_USERNAME/PASSWORD are
      # the least-privilege bot user server-infra provisioned, scoped to (and
      # living under) the irregular_verbs database.
      MONGO_URI: mongodb://${MONGO_USERNAME:?set MONGO_USERNAME in .env}:${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}@mongo:27017/?authSource=irregular_verbs
      MONGO_DB: irregular_verbs
    networks:
      - geoirb_network

networks:
  # Created once outside Compose by server-infra; its mongo service is
  # reachable here as "mongo".
  geoirb_network:
    external: true
